kind = "mobile"
previewPath = "/"
title = "Paisa Voice"
description = "A mobile-first voice and text financial assistant for checking balances, sending money, and applying for loans with Supabase-backed persistence and AI intent parsing."
version = "1.0.0"
id = "artifacts/paisa-voice"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 25976

[services.development]
run = "pnpm --filter @workspace/paisa-voice run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/paisa-voice", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/paisa-voice", "run", "serve" ]

[services.env]
PORT = "25976"
BASE_PATH = "/"
